# gitleaks reads this from the repository root. It keeps every built-in rule and only excuses
# fake sync-test credentials, published tokenizer checksums, and pinned benchmark source hashes.
[extend]
useDefault = true

# The built-in rules catch a Google OAuth client secret only beside a key-like name. The desktop's
# lives in local.properties and CI secrets, never in git, wherever it would appear.
[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth client secret"
regex = '''GOCSPX-[0-9A-Za-z_-]{28}'''
keywords = ["gocspx-"]

[[allowlists]]
description = "Fake device token (base64 of some-example-device-token) and fixed idempotency keys"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^shared/src/jvmTest/kotlin/com/vivenotes/data/sync/SyncServerClientTest\.kt$''']
regexes = [
  '''^vive_c29tZS1leGFtcGxlLWRldmljZS10b2tlbg$''',
  '''^4f2a1c88-0e3d-4c1b-8b4a-77c9f0e5d612$''',
  '''^5a3b2d99-1f4e-4d2c-9c5b-88daf1e6c723$''',
]

[[allowlists]]
description = "Published UniMERNet Small and PP-FormulaNet-S tokenizer SHA-256 checksums"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^shared/src/jvmMain/resources/ai/NOTICE\.md$''']
regexTarget = "secret"
regexes = [
  '''^02c318d9cfa95bf323371762b8f838a82709530274d36dba6eca880f0add6cc4$''',
  '''^2811d82701ec97c192fa256aa2b4516929373870ae660326cc5b1dc879b95ff2$''',
]

[[allowlists]]
description = "Exact source SHA-256 entries in the frozen 2026-10-21 benchmark manifest"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^benchmarks/results/2026-10-21/environment\.json$''']
regexTarget = "line"
regexes = [
  '''^\s*"desktopApp/src/main/kotlin/com/vivenotes/desktop/KeyBindingsFile\.kt":\s*"6ee0ae4032d81428166c1bd374fa81b30f929f8fe63752c7182d0663d13b0336",?\s*$''',
  '''^\s*"shared/src/commonMain/kotlin/com/vivenotes/ui/canvas/TextCaretKeys\.kt":\s*"224fe997cf323d37c058db7183f1bf18a02210fe60ad4cd58a4ec02c472fd227",?\s*$''',
  '''^\s*"shared/src/commonMain/kotlin/com/vivenotes/ui/keyboard/ShortcutKeys\.kt":\s*"1f714c574bc297930e253cc280fa8a2ff67c30c5404c73132252d185cb0b7752",?\s*$''',
  '''^\s*"shared/src/commonMain/kotlin/com/vivenotes/workspace/KeyBindings\.kt":\s*"cfff839e98c37803607c8ac5ff2246858fa5663ffac960a3528ff7abf9e69601",?\s*$''',
  '''^\s*"shared/src/jvmMain/kotlin/com/vivenotes/ai/FormulaTokenizerDecoder\.kt":\s*"5231334bee94e341e7682322b6af4faa58cdcf26fc5bc7fe8fe37e52c78a5127",?\s*$''',
]

[[allowlists]]
description = "Exact source SHA-256 entries in the two frozen optimized 2026-10-21 benchmark manifests"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^benchmarks/results/2026-10-21-optimized/environment\.json$''',
  '''^benchmarks/results/2026-10-21-optimized-final/environment\.json$''',
]
regexTarget = "line"
regexes = [
  '''^\s*"desktopApp/src/main/kotlin/com/vivenotes/desktop/KeyBindingsFile\.kt":\s*"6ee0ae4032d81428166c1bd374fa81b30f929f8fe63752c7182d0663d13b0336",?\s*$''',
  '''^\s*"shared/src/commonMain/kotlin/com/vivenotes/ui/canvas/TextCaretKeys\.kt":\s*"224fe997cf323d37c058db7183f1bf18a02210fe60ad4cd58a4ec02c472fd227",?\s*$''',
  '''^\s*"shared/src/commonMain/kotlin/com/vivenotes/ui/keyboard/ShortcutKeys\.kt":\s*"1f714c574bc297930e253cc280fa8a2ff67c30c5404c73132252d185cb0b7752",?\s*$''',
  '''^\s*"shared/src/commonMain/kotlin/com/vivenotes/workspace/KeyBindings\.kt":\s*"cfff839e98c37803607c8ac5ff2246858fa5663ffac960a3528ff7abf9e69601",?\s*$''',
  '''^\s*"shared/src/jvmMain/kotlin/com/vivenotes/ai/FormulaTokenizerDecoder\.kt":\s*"1149ebfe992c2ce7c3851a21f0d7cccbd8b068f2438777cf72c7f652e6423f70",?\s*$''',
]
