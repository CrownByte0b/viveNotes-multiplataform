name: Flathub source build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: build (${{ matrix.arch }})
    # Flathub builds every architecture packaging/flathub/flathub.json lists, each on its own
    # native runner; one failing does not cancel the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            timeout: 180
          - arch: aarch64
            runner: ubuntu-24.04-arm
            timeout: 240
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      VIVE_FLATHUB_APPARMOR_PROFILE: vivenotes-flathub-ci
      VIVE_FLATHUB_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare pinned Flathub builder and submission
        run: python3 -B packaging/flathub/run_ci.py --phase prepare
      - name: Test manual runner contracts
        run: python3 -B .github/tests/test_flathub_ci.py
      - name: Allow nested user namespaces for the builder container
        run: sudo apparmor_parser --replace .github/flathub-ci.apparmor
      - name: Verify isolated sandbox and loopback
        run: python3 -B packaging/flathub/run_ci.py --phase sandbox
      - name: Cache Flathub sources and build results
        uses: actions/cache@v5
        with:
          path: build/flathub-ci/${{ matrix.arch }}/work/.flatpak-builder
          key: flathub-source-${{ matrix.arch }}-${{ hashFiles('packaging/flathub/**') }}
          restore-keys: |
            flathub-source-${{ matrix.arch }}-
      - name: Validate submission manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B packaging/flathub/run_ci.py --phase manifest
      - name: Download all declared sources
        run: python3 -B packaging/flathub/run_ci.py --phase download
      - name: Build pinned manifest offline
        id: build
        run: python3 -B packaging/flathub/run_ci.py --phase build
      - name: Validate built repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B packaging/flathub/run_ci.py --phase lint
      - name: Create test bundle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 -B packaging/flathub/run_ci.py --phase bundle
      - name: Upload bundle and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ViveNotes-Flathub-${{ matrix.arch }}
          if-no-files-found: warn
          path: |
            build/flathub-ci/${{ matrix.arch }}/work/artifacts/
            build/flathub-ci/${{ matrix.arch }}/work/.local/state/flatpak_builder_lint/linter.log
            build/flathub-ci/${{ matrix.arch }}/work/builddir/files/manifest.json
