name: Linux AppImage
on:
  workflow_dispatch:
  push:
    tags: ['v*']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  appimage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORG_GRADLE_PROJECT_byteinkVersion: 0.1.0-alpha.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 27
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.19
      - name: Install packaging tools
        run: |
          sudo apt-get update
          # mksquashfs builds the image; fusermount3 lets the smoke test mount it as users do.
          # libxcb-xinput0 is the host library the app's X11 touch input needs; the runner lacks it.
          sudo apt-get install -y squashfs-tools fuse3 appstream desktop-file-utils xvfb libxcb-xinput0
      - name: Run JVM tests and lint
        timeout-minutes: 30
        run: xvfb-run -a -s '-screen 0 1920x1200x24' ./gradlew lint :shared:jvmTest :desktopApp:test --continue --no-parallel --max-workers=1 --console=plain --init-script .github/scripts/ci-tests.init.gradle
      - name: Build AppImage
        env:
          VIVE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.VIVE_GOOGLE_DESKTOP_CLIENT_ID }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python3 -B packaging/appimage/build.py --version "${GITHUB_REF_NAME#v}"
          else
            python3 -B packaging/appimage/build.py
          fi
      - name: Smoke test the AppImage
        timeout-minutes: 5
        run: xvfb-run -a python3 -B packaging/appimage/smoke_test.py
      - name: Upload AppImage and checksum
        uses: actions/upload-artifact@v7
        with:
          name: ViveNotes-Linux-AppImage-x86_64
          if-no-files-found: error
          path: |
            desktopApp/build/appimage/*.AppImage
            desktopApp/build/appimage/*.AppImage.sha256
            desktopApp/build/appimage/smoke-test.log
      - name: Upload failed test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: appimage-failure-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
            desktopApp/build/reports/tests/
            desktopApp/build/test-results/
            desktopApp/build/appimage/smoke-test.log
