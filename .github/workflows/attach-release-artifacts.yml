name: Attach release artifacts
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag with successful CI builds and a saved draft release (e.g. v1.0.0)
        required: true
        type: string
concurrency:
  group: attach-release-artifacts-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  attach:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install zsync
        run: |
          sudo apt-get update
          sudo apt-get install -y zsync
      - name: Check the attachment contracts with the installed zsyncmake
        run: python3 -B .github/tests/test_release_artifacts.py
      - name: Attach tested installers to your saved draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 -B .github/scripts/attach_release_artifacts.py --tag "$RELEASE_TAG"
